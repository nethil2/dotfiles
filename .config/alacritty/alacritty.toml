[general]
working_directory = "~"

[terminal.shell]
program = "/opt/homebrew/bin/fish"
args = ["--login"]

[font]
size = 15.0

[font.normal]
family = "SpaceMono Nerd Font"

[window]
opacity = 0.3
blur = true
decorations = "Buttonless"

[window.padding]
x = 10
y = 10

# nethil2 -- dark blue base, accent #1d4ed8
[colors.primary]
background = "#06080f"
foreground = "#e2e8f0"

[colors.cursor]
cursor = "#1d4ed8"
text = "#06080f"

[colors.selection]
background = "#1e293b"
text = "#e2e8f0"

# normal (0-7)
[colors.normal]
black = "#0a0606"
red = "#ef4444"
green = "#8ac35a"
yellow = "#f4c95d"
blue = "#4ec6e0"
magenta = "#d97aaa"
cyan = "#7ddfff"
white = "#f5ebe0"

# bright (8-15)
[colors.bright]
black = "#5a3030"
red = "#e85a6e"
green = "#a6d47a"
yellow = "#f6d882"
blue = "#7ddfff"
magenta = "#e0a0c8"
cyan = "#9de8ff"
white = "#fff0e8"
